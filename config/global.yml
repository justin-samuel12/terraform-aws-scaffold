account_id: ""
organization_sharing: false
repository: terraform-aws-scaffold
order_check: true # make check refuses a lookup missing from templates/needs.yml, and stacks that need each other in a loop
state:
  bucket: ""
  region: us-east-2
  key: "{region}/{environment}/{component}"
subnets:
  environment:
    private:
      size: 19
      start: 0
      route: hub
      reserved: 26
    data:
      size: 22
      start: 192
      route: internal
      reserved: 26
    public:
      size: 23
      start: 216
      route: internet
      reserved: 26
    ops:
      size: 23
      start: 228
      route: hub
      reserved: 26
    transit:
      size: 28
      start: 252
      route: none
  hub:
    public:
      size: 24
      start: 0
    transit:
      size: 28
      start: 15
    dns:
      size: 28
      start: 14
prefix_lists:
dns:
  inbound: false
  private_zones:
codedeploy:
  deployment_group_names:
    - master
    - development
    - adhoc
  deployment_config_name: CodeDeployDefault.OneAtATime
  auto_rollback_configuration:
    events:
      - DEPLOYMENT_FAILURE
sites:
  office:
    enabled: true
    ip_address: null
    bgp_asn: 65010
    cidrs: []
directory:
  enabled: false
  name: ad.example.internal
  short_name: EXAMPLE
  edition: Standard
  description: AWS Managed Microsoft AD, in the primary hub

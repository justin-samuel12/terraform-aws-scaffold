runtime: python3.12
handler: app.handler
memory: 256
timeout: 30
schedule: rate(1 day)
environment:
  LEVEL: info
  BUCKET: development-uploads-222222222222-us-east-1 # the uploads bucket's name, from the buckets stack
statements:
  - actions:
      - s3:ListBucket
    resources:
      - arn:aws:s3:::development-uploads-*

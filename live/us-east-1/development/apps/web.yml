# The web application: its servers, its route on the web load balancer, CodeDeploy, and its DNS name.
servers:
  count: 2
  type: t3.small
  image: ami-0123456789abcdef0
  tier: private
  role: web
  security_groups:
    - web
port: 3000
health: /health
target:
  slow_start: 30
routes:
  - load_balancer: web
    hosts:
      - app.example.com
    priority: 1000
deploy: one-at-a-time
names:
  - name: app
    zone: example.com

# Answers 404 to anything no rule or application claims; the web application claims app.example.com from apps/web.yml.
type: application
scheme: internet-facing
security_groups:
  - web-lb
certificate: app.example.com
listeners:
  "443":
    protocol: HTTPS
rules:
  www:
    listener: 443
    priority: 10
    hosts:
      - www.example.com
    redirect:
      host: app.example.com

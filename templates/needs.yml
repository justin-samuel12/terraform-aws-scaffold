access:
  needs: []

backups:
  needs:
    - "{region}/{environment}/keys"
    - global/{environment}/pipeline

baseline:
  needs: []

buckets:
  needs:
    - "{region}/{environment}/keys"

certificates:
  needs:
    - global/shared/dns

cloudfront:
  needs: []
  named_in_files:
    - buckets
    - certificates
    - logging

compute:
  needs:
    - "{region}/{environment}/network"
    - "{region}/{environment}/security-groups"
    - "{region}/{environment}/keys"
    - global/{environment}/iam
    - global/shared/dns
    - global/{environment}/zones
    - global/{environment}/pipeline
  when_present:
    - "{region}/{environment}/load-balancers"

databases:
  needs:
    - "{region}/{environment}/network"
    - "{region}/{environment}/security-groups"
    - "{region}/{environment}/keys"
    - global/shared/iam
    - global/{environment}/pipeline
  when_present:
    - "{region}/{environment}/buckets"

dns:
  needs:
    - "{each_region}/shared/hub"
    - global/{environment}/pipeline

documents:
  needs: []

domain-join:
  needs: []

ecr:
  needs: []

endpoints:
  needs:
    - "{region}/{environment}/network"
    - "{region}/{environment}/security-groups"

hub:
  needs:
    - global/{environment}/pipeline
  when_primary:
    - "{other_regions}/shared/hub"

iam:
  needs:
    - global/{environment}/pipeline

keys:
  needs: []

lambda:
  needs:
    - global/{environment}/pipeline
  when_present:
    - "{region}/{environment}/network"
    - "{region}/{environment}/security-groups"
    - "{region}/{environment}/messaging"

load-balancers:
  needs:
    - "{region}/{environment}/network"
    - "{region}/{environment}/security-groups"
    - "{region}/{environment}/logging"
  when_present:
    - "{region}/{environment}/certificates"

logging:
  needs: []

messaging:
  needs:
    - "{region}/{environment}/keys"

network:
  needs:
    - "{region}/shared/hub"
    - global/shared/dns
    - global/{environment}/pipeline
  when_present:
    - global/shared/pipeline

patching:
  needs: []

pipeline:
  needs: []
  when_present:
    - global/shared/pipeline

records:
  needs:
    - global/shared/dns
    - global/{environment}/zones
  when_present:
    - "{region}/{environment}/compute"
    - "{region}/{environment}/load-balancers"

security-groups:
  needs:
    - "{region}/{environment}/network"
    - "{region}/shared/hub"

session-manager:
  needs:
    - global/{environment}/pipeline

storage:
  needs:
    - "{region}/{environment}/network"
    - "{region}/{environment}/security-groups"
    - "{region}/{environment}/keys"

waf:
  needs:
    - "{region}/{environment}/load-balancers"
    - "{region}/{environment}/logging"

kubernetes:
  needs:
    - "{region}/{environment}/network"
    - "{region}/{environment}/security-groups"
    - "{region}/{environment}/keys"
    - global/{environment}/pipeline

containers:
  needs:
    - "{region}/{environment}/network"
    - "{region}/{environment}/security-groups"
    - "{region}/{environment}/keys"
    - global/{environment}/pipeline
  when_present:
    - "{region}/{environment}/load-balancers"

zones:
  needs:
    - "{each_region}/{environment}/network"
    - "{each_region}/shared/hub"
    - global/shared/dns
  when_present:
    - global/shared/pipeline

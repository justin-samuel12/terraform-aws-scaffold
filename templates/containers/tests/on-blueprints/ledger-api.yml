blueprint: ecs-service/v1
container_definitions:
  - name: ledger-api
    image: 111111111111.dkr.ecr.us-east-2.amazonaws.com/ledger-api:1.0.0
    portMappings:
      - containerPort: 8080
listener_rule:
  listener_arn: services/443
  priority: 1410
  condition:
    path_pattern:
      values:
        - /ledger/*
runtime_platform:
  cpu_architecture: ARM64

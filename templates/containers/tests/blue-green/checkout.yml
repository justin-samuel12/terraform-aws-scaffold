cpu: 1024
memory: 2048
desired_count: 3
security_groups:
  - checkout
runtime_platform:
  cpu_architecture: ARM64
image: 111111111111.dkr.ecr.us-east-2.amazonaws.com/checkout:2.0.0
port: 3000
health_check:
  path: /ready
listener_rules:
  - load_balancer: internal
    host_header:
      - checkout.example.com
    path_pattern:
      - /api/*
    priority: 1300
deployment:
  strategy: blue_green
  deployment_config_name: CodeDeployDefault.ECSCanary10Percent5Minutes
  termination_wait_time_in_minutes: 15

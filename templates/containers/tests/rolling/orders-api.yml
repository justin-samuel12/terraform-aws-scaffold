cpu: 512
memory: 1024
desired_count: 2
security_groups:
  - orders-api
image: 111111111111.dkr.ecr.us-east-2.amazonaws.com/orders-api:1.4.2
port: 8080
environment:
  LOG_LEVEL: info
secrets:
  DATABASE_URL: arn:aws:secretsmanager:us-east-2:111111111111:secret:operations/orders/database-AbCdEf
health_check:
  path: /health
listener_rules:
  - load_balancer: internal
    host_header:
      - orders.example.com
    priority: 1200
autoscaling:
  min_capacity: 2
  max_capacity: 6
  target_tracking_configuration:
    predefined_metric_type: ALBRequestCountPerTarget
    target_value: 500
statement:
  - actions:
      - sqs:SendMessage
    resources:
      - arn:aws:sqs:{region}:111111111111:{environment}-orders

cpu: 256
memory: 512
desired_count: 1
network_configuration:
  subnets:
    - private-az9
  security_groups:
    - web
container_definitions:
  - name: servers
    image: nginx:1.27
    portMappings:
      - containerPort: 80
listener_rule:
  listener_arn: internal/443
  priority: 900
  condition:
    host_header:
      values:
        - servers.example.com
deployment_controller:
  type: CODE_DEPLOY
deployment_group:
  deployment_config_name: CodeDeployDefault.OneAtATime

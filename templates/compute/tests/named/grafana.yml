count: 2
instance_type: t3.medium
ami: ami-0123456789abcdef0
tier: ops
iam_instance_profile: grafana
vpc_security_group_ids:
  - grafana
target_group:
  port: 3000
  slow_start: 30
  health_check:
    path: /api/health
listener_rule:
  listener_arn: internal/443
  priority: 1010
  condition:
    host_header:
      values:
        - grafana.example.com
route53_records:
  - name: grafana.operations.corp.internal
    type: A
    zone_id: operations.corp.internal
    alias:
      name: internal
      evaluate_target_health: true
  - name: grafana-operations.example.com
    type: A
    zone_id: example.com
    alias:
      name: internal
      evaluate_target_health: true
tags:
  CodeDeploy: "['grafana']"

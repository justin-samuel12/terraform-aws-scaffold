count: 1
instance_type: t3.medium
ami: ami-0123456789abcdef0
tier: ops
iam_instance_profile: grafana
security_groups:
  - grafana
backup: true
user_data: boot.sh
target_group:
  port: 3000
  stickiness:
    cookie_duration: 3600
listener_rule:
  listener_arn: internal/443
  priority: 1010
  condition:
    host_header:
      values:
        - grafana.example.com
route53_records:
  - name: grafana
    zone: example.com

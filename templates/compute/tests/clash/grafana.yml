count: 2
instance_type: t3.medium
ami: ami-0123456789abcdef0
tier: ops
iam_instance_profile: grafana
security_groups:
  - grafana
target_group:
  port: 3000
  health_check:
    path: /api/health
listener_rules:
  - load_balancer: internal
    host_header:
      - grafana.example.com
    priority: 1010
codedeploy:
  deployment_config_name: CodeDeployDefault.OneAtATime
route53_records:
  - name: grafana
    zone: example.com
    private_zone: true

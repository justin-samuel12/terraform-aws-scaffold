count: 2
instance_type: t3.medium
ami: ami-0123456789abcdef0
tier: ops
iam_instance_profile: prometheus
security_groups:
  - prometheus
target_group:
  port: 9090
  health_check:
    path: /api/health
listener_rules:
  - load_balancer: internal
    host_header:
      - prometheus.example.com
    priority: 1010
codedeploy:
  deployment_config_name: CodeDeployDefault.OneAtATime
route53_records:
  - name: prometheus
    zone: example.com
    private_zone: true

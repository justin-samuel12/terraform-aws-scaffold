count: 2
instance_type: t3.medium
ami: ami-0123456789abcdef0
tier: ops
iam_instance_profile: prometheus
vpc_security_group_ids:
  - prometheus
target_group:
  port: 9090
  health_check:
    path: /api/health
listener_rule:
  listener_arn: internal/443
  priority: 1010
  condition:
    host_header:
      values:
        - prometheus.example.com
route53_records:
  - name: prometheus.example.com
    type: A
    zone_id: example.com
    alias:
      name: internal
      evaluate_target_health: true
tags:
  CodeDeploy: "['prometheus']"

description: Grafana servers
assume_role_policy:
  statement:
    - effect: Allow
      actions:
        - sts:AssumeRole
      principals:
        - type: Service
          identifiers:
            - ec2.amazonaws.com
managed_policy_arns:
  - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
  - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
  - read-tags
  - session-manager
statement:
  - effect: Allow
    actions:
      - s3:GetObject
    resources:
      - arn:aws:s3:::grafana-dashboards/*
    condition:
      - test: Bool
        variable: aws:SecureTransport
        values:
          - "true"

default_action:
  allow:
rule:
  - name: rate-limit
    priority: 0
    action:
      block:
    statement:
      rate_based_statement:
        limit: 1000
        aggregate_key_type: IP
    visibility_config:
      cloudwatch_metrics_enabled: true
      metric_name: web-rate-limit
      sampled_requests_enabled: true
  - name: AWSManagedRulesCommonRuleSet
    priority: 1
    override_action:
      none:
    statement:
      managed_rule_group_statement:
        name: AWSManagedRulesCommonRuleSet
        vendor_name: AWS
    visibility_config:
      cloudwatch_metrics_enabled: true
      metric_name: web-AWSManagedRulesCommonRuleSet
      sampled_requests_enabled: true
visibility_config:
  cloudwatch_metrics_enabled: true
  metric_name: web
  sampled_requests_enabled: true
resource_arns:
  - web
  - arn:aws:elasticloadbalancing:us-east-2:111111111111:loadbalancer/app/other/def

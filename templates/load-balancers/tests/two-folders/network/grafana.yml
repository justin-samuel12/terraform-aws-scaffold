load_balancer_type: application
internal: true
subnets:
  - private-az1
  - private-az2
  - subnet-0123456789abcdef0
security_groups:
  - grafana-lb
listeners:
  - port: 443
    protocol: HTTPS
    certificate_arn: grafana.example.com
    default_action:
      type: forward
      target_group_arn: web
  - port: 80
    protocol: HTTP
    default_action:
      type: redirect
      redirect:
        port: "443"
        protocol: HTTPS
        status_code: HTTP_301
target_groups:
  web:
    port: 3000
    protocol: HTTP
    target_type: instance
    deregistration_delay: 60
    health_check:
      path: /api/health
      matcher: 200-399
listener_rules:
  old-name:
    listener_arn: 443
    priority: 10
    action:
      type: redirect
      redirect:
        host: grafana.example.com
        status_code: HTTP_301
    condition:
      host_header:
        values:
          - metrics.example.com

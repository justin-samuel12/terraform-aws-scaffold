load_balancer_type: application
internal: false
subnets:
  - public-az1
  - public-az2
listeners:
  - port: 443
    protocol: HTTPS
    certificate_arn: www.example.com
    default_action:
      type: fixed-response
      fixed_response:
        content_type: text/plain
        message_body: Not found
        status_code: "404"

load_balancer_type: application
internal: true
security_groups:
  - grafana-lb
certificate: grafana.example.com
listeners:
  "443":
    protocol: HTTPS
    target: web
  "80":
    protocol: HTTP
    redirect: true
targets:
  web:
    port: 3000
    protocol: HTTP
    health_check:
      path: /api/health
rules:
  old-name:
    listener: 443
    priority: 10
    host_header:
      - metrics.example.com
    redirect:
      host: grafana.example.com

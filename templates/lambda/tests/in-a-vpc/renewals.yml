runtime: python3.12
handler: app.handler
layers:
  - arn:aws:lambda:us-east-2:111111111111:layer:cryptography:1
vpc_config:
  subnet_ids:
    - private-az1
    - subnet-0b
  security_group_ids:
    - certificates
cloudwatch_event_rule:
  event_pattern:
    source:
      - aws.acm
    detail-type:
      - ACM Certificate Available
cloudwatch_log_group:
  retention_in_days: 365
architectures:
  - x86_64

namespace: orders-api
service_account: orders-api
managed_policy_arns:
  - arn:aws:iam::aws:policy/AdministratorAccess
  - AmazonS3ReadOnlyAccess
statement:
  - action: s3:GetObject
  - actions: s3:PutObject
    resources: arn:aws:s3:::operations-billing/*
    condition:
      - test: StringEquals
        variable: aws:ResourceAccount

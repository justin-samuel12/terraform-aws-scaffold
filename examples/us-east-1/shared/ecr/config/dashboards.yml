lifecycle_policy:
  policy:
    rules:
      - rulePriority: 1
        description: Untagged images expire after 14 days
        selection:
          tagStatus: untagged
          countType: sinceImagePushed
          countUnit: days
          countNumber: 14
        action:
          type: expire
      - rulePriority: 2
        description: Keep the newest 30 images
        selection:
          tagStatus: any
          countType: imageCountMoreThan
          countNumber: 30
        action:
          type: expire
repository_policy:
  policy:
    Version: "2012-10-17"
    Statement:
      - Sid: DevelopmentPulls
        Effect: Allow
        Principal:
          AWS:
            - development
        Action:
          - ecr:BatchGetImage
          - ecr:GetDownloadUrlForLayer
          - ecr:BatchCheckLayerAvailability

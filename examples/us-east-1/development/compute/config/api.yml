instance_type: m6i.large
ami: ami-0123456789abcdef0
tier: private
iam_instance_profile: dashboards
vpc_security_group_ids:
  - dashboards
  - services-lb-clients
  - monitoring-agent
autoscaling_group:
  min_size: 2
  max_size: 6
  desired_capacity: 2
autoscaling_policy:
  target_tracking_configuration:
    predefined_metric_specification:
      predefined_metric_type: ASGAverageCPUUtilization
    target_value: 50
target_group:
  port: 8080
  health_check:
    path: /health
listener_rule:
  listener_arn: internal/443
  priority: 1100
  condition:
    host_header:
      values:
        - api.example.com
tags:
  CodeDeploy: "['external-api-service']"
route53_records:
  - name: api.example.com
    type: A
    zone_id: example.com
    alias:
      name: internal
      evaluate_target_health: true

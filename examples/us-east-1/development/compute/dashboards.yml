# A group behind the internal load balancer: its route, CodeDeploy deployments and DNS name live here too.
count: 2
instance_type: t3.medium
ami: ami-0123456789abcdef0
tier: ops
iam_instance_profile: dashboards
security_groups:
  - dashboards
target_group:
  port: 3000
  slow_start: 30
  health_check:
    path: /api/health
listener_rules:
  - load_balancer: internal
    host_header:
      - dashboards.example.com
    priority: 1000
codedeploy:
  deployment_config_name: CodeDeployDefault.OneAtATime
route53_records:
  - name: dashboards
    zone: example.com

# An Auto Scaling group: 2 to 6 instances across every zone of the private tier, keeping CPU near 50%, behind the internal load balancer.
instance_type: m6i.large
ami: ami-0123456789abcdef0
tier: private
iam_instance_profile: dashboards
security_groups:
  - dashboards
autoscaling:
  min_size: 2
  max_size: 6
  desired_capacity: 2
  target_tracking_configuration:
    predefined_metric_type: ASGAverageCPUUtilization
    target_value: 50
target_group:
  port: 8080
  health_check:
    path: /health
listener_rules:
  - load_balancer: internal
    host_header:
      - api.example.com
    priority: 1100
codedeploy:
  deployment_config_name: CodeDeployDefault.OneAtATime
route53_records:
  - name: api
    zone: example.com

# Servers that hold state: pinned to subnets, with chosen addresses identical in every environment.
count: 2
instance_type: r6i.xlarge
ami: ami-0123456789abcdef0
iam_instance_profile: runner
security_groups:
  - sqlserver
ebs_block_device:
  data:
    device_name: /dev/sdf
    volume_size: 500
    iops: 6000
    throughput: 250
members:
  sqlserver-01:
    subnet: data-az1
    ips:
      primary: 70
      cluster: 71
      listener: 72
  sqlserver-02:
    subnet: data-az2
    ips:
      primary: 70
      cluster: 71
      listener: 72

default_action:
  allow:
rule:
  - name: rate-limit
    priority: 0
    action:
      block:
    statement:
      rate_based_statement:
        limit: 2000
        aggregate_key_type: IP
    visibility_config:
      cloudwatch_metrics_enabled: true
      metric_name: development-internal-rate-limit
      sampled_requests_enabled: true
  - name: AWSManagedRulesCommonRuleSet
    priority: 1
    override_action:
      none:
    statement:
      managed_rule_group_statement:
        name: AWSManagedRulesCommonRuleSet
        vendor_name: AWS
    visibility_config:
      cloudwatch_metrics_enabled: true
      metric_name: development-internal-AWSManagedRulesCommonRuleSet
      sampled_requests_enabled: true
  - name: AWSManagedRulesKnownBadInputsRuleSet
    priority: 2
    override_action:
      none:
    statement:
      managed_rule_group_statement:
        name: AWSManagedRulesKnownBadInputsRuleSet
        vendor_name: AWS
    visibility_config:
      cloudwatch_metrics_enabled: true
      metric_name: development-internal-AWSManagedRulesKnownBadInputsRuleSet
      sampled_requests_enabled: true
  - name: AWSManagedRulesAmazonIpReputationList
    priority: 3
    override_action:
      none:
    statement:
      managed_rule_group_statement:
        name: AWSManagedRulesAmazonIpReputationList
        vendor_name: AWS
    visibility_config:
      cloudwatch_metrics_enabled: true
      metric_name: development-internal-AWSManagedRulesAmazonIpReputationList
      sampled_requests_enabled: true
visibility_config:
  cloudwatch_metrics_enabled: true
  metric_name: development-internal
  sampled_requests_enabled: true
resource_arns:
  - internal

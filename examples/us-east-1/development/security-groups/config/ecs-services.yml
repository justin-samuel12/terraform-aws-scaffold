description: Every ECS service on the ecs-service blueprint, reached only by the services load balancer on 8080
tags:
  Kind: server
ingress:
  - description: The application, from the services load balancer
    ip_protocol: tcp
    from_port: 8080
    to_port: 8080
    referenced_security_group_id: services-lb
egress:
  - description: Internal traffic, through the hub
    ip_protocol: "-1"
    cidr_ipv4: 10.0.0.0/8
  - description: HTTPS out, through the hub egress
    ip_protocol: tcp
    from_port: 443
    to_port: 443
    cidr_ipv4: 0.0.0.0/0
  - description: HTTP out, through the hub egress, for package mirrors and Windows Update
    ip_protocol: tcp
    from_port: 80
    to_port: 80
    cidr_ipv4: 0.0.0.0/0

description: The mount targets of the shared file system
tags:
  Kind: database
ingress:
  - description: NFS from the dashboards
    ip_protocol: tcp
    from_port: 2049
    to_port: 2049
    referenced_security_group_id: dashboards
egress:
  - description: Internal traffic, through the hub
    ip_protocol: "-1"
    cidr_ipv4: 10.0.0.0/8
  - description: HTTPS out, through the hub egress
    ip_protocol: tcp
    from_port: 443
    to_port: 443
    cidr_ipv4: 0.0.0.0/0
  - description: HTTP out, through the hub egress, for package mirrors and Windows Update
    ip_protocol: tcp
    from_port: 80
    to_port: 80
    cidr_ipv4: 0.0.0.0/0

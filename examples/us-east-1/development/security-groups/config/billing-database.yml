description: The billing database (RDS for SQL Server)
tags:
  Kind: database
ingress:
  - description: SQL Server from the orders API and checkout
    ip_protocol: tcp
    from_port: 1433
    to_port: 1433
    referenced_security_group_id: orders-api
  - description: SQL Server from the orders API and checkout
    ip_protocol: tcp
    from_port: 1433
    to_port: 1433
    referenced_security_group_id: checkout
  - description: SQL Server from the operator tooling, for administration and migrations
    ip_protocol: tcp
    from_port: 1433
    to_port: 1433
    referenced_security_group_id: operators
egress:
  - description: Internal traffic, through the hub
    ip_protocol: "-1"
    cidr_ipv4: 10.0.0.0/8
  - description: HTTPS out, through the hub egress
    ip_protocol: tcp
    from_port: 443
    to_port: 443
    cidr_ipv4: 0.0.0.0/0
  - description: HTTP out, through the hub egress, for package mirrors and Windows Update
    ip_protocol: tcp
    from_port: 80
    to_port: 80
    cidr_ipv4: 0.0.0.0/0

description: The Kubernetes API (EKS), for people running kubectl from the office or the VPN
tags:
  Kind: endpoint
ingress:
  - description: kubectl, from the office and the VPN
    ip_protocol: tcp
    from_port: 443
    to_port: 443
    cidr_ipv4: 192.168.0.0/16
egress:
  - description: Internal traffic, through the hub
    ip_protocol: "-1"
    cidr_ipv4: 10.0.0.0/8
  - description: HTTPS out, through the hub egress
    ip_protocol: tcp
    from_port: 443
    to_port: 443
    cidr_ipv4: 0.0.0.0/0
  - description: HTTP out, through the hub egress, for package mirrors and Windows Update
    ip_protocol: tcp
    from_port: 80
    to_port: 80
    cidr_ipv4: 0.0.0.0/0

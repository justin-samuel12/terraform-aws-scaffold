runtime: python3.12
handler: app.handler
memory_size: 256
timeout: 30
schedule_expression: rate(1 day)
environment:
  variables:
    LEVEL: info
    BUCKET: development-exports-111111111111-us-east-1 # the exports bucket's name, from the buckets stack
statement:
  - actions:
      - s3:ListBucket
    resources:
      - arn:aws:s3:::development-exports-*

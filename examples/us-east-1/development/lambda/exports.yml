# Takes export requests from the messaging stack's exports queue, a few at a time, and writes each to the exports bucket.
runtime: python3.12
handler: app.handler
memory_size: 256
timeout: 60
event_source_mapping:
  event_source_arn: queue:exports
  batch_size: 5
environment:
  variables:
    LEVEL: info
    BUCKET: development-exports-111111111111-us-east-1 # the exports bucket's name, from the buckets stack
statement:
  - actions:
      - s3:PutObject
    resources:
      - arn:aws:s3:::development-exports-*/*

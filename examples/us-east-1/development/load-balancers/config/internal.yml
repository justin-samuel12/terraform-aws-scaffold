load_balancer_type: application
internal: true
subnets:
  - private-az1
  - private-az2
  - private-az4
security_groups:
  - dashboards-lb
listeners:
  - port: 443
    protocol: HTTPS
    certificate_arn: dashboards.example.com
    default_action:
      type: fixed-response
      fixed_response:
        content_type: text/plain
        message_body: Not found
        status_code: "404"
listener_rules:
  old-name:
    listener_arn: 443
    priority: 10
    action:
      type: redirect
      redirect:
        host: dashboards.example.com
        status_code: HTTP_301
    condition:
      host_header:
        values:
          - grafana.example.com

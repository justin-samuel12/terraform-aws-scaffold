load_balancer_type: network
internal: true
subnets:
  - private-az1
  - private-az2
  - private-az4
security_groups:
  - collectors-lb
listeners:
  - port: 10051
    protocol: TCP
    default_action:
      type: forward
      target_group_arn: agents
target_groups:
  agents:
    port: 10051
    protocol: TCP
    target_type: instance
    deregistration_delay: 60
    health_check:
      protocol: TCP
      interval: 30
      healthy_threshold: 3
      unhealthy_threshold: 3

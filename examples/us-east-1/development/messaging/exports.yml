# Export requests: the dashboards application publishes one per request; the exports function takes them from the queue.
# The alerts address hears only about failures, and alarms in this account may publish too.
queue:
  visibility_timeout_seconds: 360 # six times the function's 60-second timeout
  dead_letter:
    max_receive_count: 5
topic:
  subscriptions:
    - protocol: sqs
      endpoint: queue:exports
      raw_message_delivery: true
    - protocol: email
      endpoint: alerts@example.com
      filter_policy:
        status:
          - failed
  publishers:
    - cloudwatch

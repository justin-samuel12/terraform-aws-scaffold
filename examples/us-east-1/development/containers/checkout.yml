# A blue/green canary: CodeDeploy starts the new version beside the old, sends it 10% of traffic for 5 minutes, then the rest.
cpu: 1024
memory: 2048
desired_count: 3
tier: private
security_groups:
  - checkout
runtime_platform:
  cpu_architecture: ARM64
image: 111111111111.dkr.ecr.us-east-1.amazonaws.com/checkout:2.0.0
port: 3000
health_check:
  path: /ready
listener_rules:
  - load_balancer: internal
    host_header:
      - checkout.example.com
    priority: 1310
deployment:
  strategy: blue_green
  deployment_config_name: CodeDeployDefault.ECSCanary10Percent5Minutes
  termination_wait_time_in_minutes: 15

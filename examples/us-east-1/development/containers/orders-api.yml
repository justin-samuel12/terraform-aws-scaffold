# A rolling service: ECS replaces tasks a few at a time behind the internal load balancer, scaling on CPU between 2 and 6.
cpu: 512
memory: 1024
desired_count: 2
tier: private
security_groups:
  - orders-api
image: 111111111111.dkr.ecr.us-east-1.amazonaws.com/orders-api:1.4.2
port: 8080
environment:
  LOG_LEVEL: info
secrets:
  DATABASE_URL: arn:aws:secretsmanager:us-east-1:111111111111:secret:development/orders-api/database-AbCdEf
health_check:
  path: /health
listener_rules:
  - load_balancer: internal
    host_header:
      - orders.example.com
    priority: 1300
autoscaling:
  min_capacity: 2
  max_capacity: 6
  target_tracking_configuration:
    predefined_metric_type: ECSServiceAverageCPUUtilization
    target_value: 60
statement:
  - actions:
      - sns:Publish
    resources:
      - arn:aws:sns:{region}:111111111111:{environment}-exports

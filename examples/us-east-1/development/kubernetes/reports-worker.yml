# The reports worker reads finished exports from the exports bucket. Its pods run in namespace reports.
namespace: reports
service_account: reports-worker
statement:
  - actions:
      - s3:GetObject
    resources:
      - arn:aws:s3:::development-exports-*/*
  - actions:
      - kms:Decrypt
    resources:
      - "*"
    condition:
      - test: StringEquals
        variable: kms:ViaService
        values:
          - s3.us-east-1.amazonaws.com

namespace: orders-api
service_account: orders-api
statement:
  - actions:
      - sqs:SendMessage
    resources:
      - arn:aws:sqs:us-east-1:*:development-exports
  - actions:
      - kms:GenerateDataKey
      - kms:Decrypt
    resources:
      - "*"
    condition:
      - test: StringEquals
        variable: kms:ViaService
        values:
          - sqs.us-east-1.amazonaws.com

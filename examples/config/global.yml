# The examples' own config: one region, us-east-1, with one environment, development. Never used by live/.
# The account every environment and hub uses, unless its entry in config/<region>.yml names its own. Quote it.
account_id: ""
state:
  bucket: ""
  region: us-east-1
  key: '{region}/{environment}/{component}'
subnets:
  environment:
    private:
      size: 19
      start: 0
      route: hub
      reserved: 26
    data:
      size: 22
      start: 192
      route: internal
      reserved: 26
    public:
      size: 23
      start: 216
      route: internet
      reserved: 26
    ops:
      size: 23
      start: 228
      route: hub
      reserved: 26
    transit:
      size: 28
      start: 252
      route: none
  hub:
    public:
      size: 24
      start: 0
    transit:
      size: 28
      start: 15
    dns:
      size: 28
      start: 14
hq:
  ip_address: 203.0.113.10
  bgp_asn: 65010
  cidrs:
    - 192.168.0.0/16
prefix_lists:
  staff:
    - cidr: 192.168.20.0/24
      description: Staff VPN
dns:
  inbound: false
  forward:
    ad.example.com:
      - 192.168.10.10
      - 192.168.10.11
  private_zones:
    - internal.example.com
# How every CodeDeploy application deploys, unless its compute stack's deployments/<application>.yml says otherwise.
# Servers say which applications they run in their CodeDeploy tag -- docs/compute.md#deploying-with-codedeploy.
codedeploy:
  deployment_group_names: # one per branch deployed from; a shared, containerized application gets primary-<environment> instead
    - master
    - development
    - adhoc
  deployment_config_name: CodeDeployDefault.OneAtATime
  auto_rollback_configuration:
    events:
      - DEPLOYMENT_FAILURE
  # bootstrap: a GitHub revision deployed and stopped once per application, so CodeDeploy's GitHub connection exists first.
  # bootstrap:
  #   repository: <organization>/<repository>
  #   commit_id: <a commit in it>

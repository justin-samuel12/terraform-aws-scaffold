account_id: ""
state:
  bucket: ""
  region: us-east-1
  key: '{region}/{environment}/{component}'
subnets:
  environment:
    private:
      size: 19
      start: 0
      route: hub
      reserved: 26
    data:
      size: 22
      start: 192
      route: internal
      reserved: 26
    public:
      size: 23
      start: 216
      route: internet
      reserved: 26
    ops:
      size: 23
      start: 228
      route: hub
      reserved: 26
    transit:
      size: 28
      start: 252
      route: none
  hub:
    public:
      size: 24
      start: 0
    transit:
      size: 28
      start: 15
    dns:
      size: 28
      start: 14
sites:
  office:
    ip_address: 203.0.113.10
    bgp_asn: 65010
    cidrs:
      - 192.168.0.0/16
    forward:
      corp.example.com:
        - 192.168.10.10
        - 192.168.10.11
  partner:
    enabled: false
    ip_address: 198.51.100.20
    bgp_asn: 65020
    cidrs:
      - 172.20.0.0/16
prefix_lists:
  staff:
    - cidr: 192.168.20.0/24
      description: Staff VPN
dns:
  inbound: false
  private_zones:
    - internal.example.com
  public_domain:
    - example.com
  private_domain: example.internal
codedeploy:
  deployment_group_names:
    - master
    - development
    - adhoc
  deployment_config_name: CodeDeployDefault.OneAtATime
  auto_rollback_configuration:
    events:
      - DEPLOYMENT_FAILURE
directory:
  enabled: false
  name: ad.corp.internal
  short_name: CORP
  edition: Standard
  description: AWS Managed Microsoft AD, in the primary hub
